version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceclone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceclone
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voiceclone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceclone -d voiceclone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voiceclone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: voiceclone_api
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://voiceclone:password@postgres:5432/voiceclone
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: voiceclone_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://voiceclone:password@postgres:5432/voiceclone
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

volumes:
  postgres_data:
